<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="piedraPapelTijera.css">
	<title>Piedra Papel Tijera</title>
</head>
<body>

	<h1>Juego de Piedra Papel Tijera</h1>

	<p><label for="nombre">Introduce el nombre del jugador </label><input id="nombre" type="text" name="nombre" autocomplete="nickname"></p>
	<p><label for="partidas">¿Cuántas partidas quieres jugar? </label><input id="partidas" type="number" name="partidas" value="0" min="1"></p>
	<button id="jugar-btn" type="button">¡JUGAR!</button>

	<h3>Jugando la partida <span id="actual">0</span> de <span id="total">0</span>.</h3>

	<div id="jugador" aria-label="Opciones del jugador">
		<img class="seleccionado" src="img/defecto.png" alt="Piedra">
		<img class="noSeleccionado" src="img/defecto.png" alt="Papel">
		<img class="noSeleccionado" src="img/defecto.png" alt="Tijera">
	</div>

	<h2>Piedra, papel o tijera.... <button id="ya-btn" type="button">¡YA!</button></h2>

	<div id="maquina">
		<img src="img/defecto.png" alt="Selección de la máquina">
	</div>

	<div>
		<h3>Marcador</h3>
		<p id="victory-count">Victorias Jugador: 0, Victorias Máquina: 0</p>
	</div>

	<div>
		<h3>Historial de partidas</h3>
		<ul id="historial"></ul>
		<button id="reset-btn" type="button">RESET</button>
	</div>

	<script type="text/javascript" src="piedraPapelTijera.js"></script>

</body>
</html>
